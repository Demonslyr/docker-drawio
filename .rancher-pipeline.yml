stages:
- name: build
  steps:
  - publishImageConfig:
      dockerfilePath: ./debian/Dockerfile
      buildContext: ./debian/
      tag: atriarch-drawio:v1.0.${CICD_EXECUTION_SEQUENCE}
      pushRemote: true
      registry: docker.atriarch.systems
    env:
      PLUGIN_MTU: "1400"
      PLUGIN_DEBUG: "true"
      PLUGIN_INSECURE: "true"
- name: Deploy
  steps:
  - applyYamlConfig:
      path: ./deployment.yaml
timeout: 20
branch:
  include:
  - atriarch-k8s-config
notification: {}
